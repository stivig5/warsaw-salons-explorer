spring.application.name=warsaw_salons

spring.datasource.url=jdbc:postgresql://localhost:5432/salons_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Springdoc bug workaround for Spring Boot 4.0
springdoc.enable-data-rest=false
springdoc.enable-hateoas=false